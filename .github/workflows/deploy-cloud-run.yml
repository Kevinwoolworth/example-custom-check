# .github/workflows/deploy.yml

on:
  push:
    branches:
      - test-custom-check # This workflow runs on pushes to this branch

# Permissions required for the checkout and auth actions
permissions:
  contents: read
  id-token: write # Required for the google-github-actions/auth action

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    # Define environment variables for the entire job
    env:
      # The image path in Artifact Registry
      IMAGE: ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/example-custom-check/example-custom-check:${{ github.sha }}
      REGION: ${{ secrets.REGION }}
      SERVICE: example-custom-check # The name of your Cloud Run service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud for gcloud and Docker
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      # 2. Configure Docker to authenticate with Artifact Registry
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 3. Set up Docker Buildx for advanced build capabilities
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # 4. Build and push the Docker image to Artifact Registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .       # Use the current directory as the build context
          push: true       # Push the image after building
          tags: ${{ env.IMAGE }} # Tag the image with the path defined above
          cache-from: type=gha # Enable GitHub Actions cache for faster builds
          cache-to: type=gha,mode=max

      # 5. Deploy the image from Artifact Registry to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "APOLLO_HMAC_TOKEN=${{ secrets.APOLLO_HMAC_TOKEN }},APOLLO_API_KEY=${{ secrets.APOLLO_API_KEY }}"
