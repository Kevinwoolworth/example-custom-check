on:
  push:
    branches:
      - test-custom-check

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure gcloud project
        run: gcloud config set project ${{ secrets.GCP_PROJECT }}

      - name: Build and push container with Cloud Build
        env:
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT }}/example-custom-check:${{ github.sha }}
        run: |
          gcloud builds submit --tag "$IMAGE" .

      - name: Deploy to Cloud Run
        env:
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT }}/example-custom-check:${{ github.sha }}
          REGION: ${{ secrets.REGION }}
          SERVICE: example-custom-check
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "APOLLO_HMAC_TOKEN=${{ secrets.APOLLO_HMAC_TOKEN }},APOLLO_API_KEY=${{ secrets.APOLLO_API_KEY }}"